name: ZION CORE CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and test runner
        run: python -m pip install -r requirements.txt "pytest>=8,<9"

      # pytest runs both styles in tests/: the unittest.TestCase classes and the
      # plain pytest functions (13 files) that unittest discovery cannot collect.
      - name: Run ZION tests
        run: python -m pytest tests -q
