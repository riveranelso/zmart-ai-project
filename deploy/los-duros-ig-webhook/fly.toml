# Los Duros Instagram webhook receiver — ISOLATED Fly.io service.
#
# TENANT: los-duros ONLY. This app must never host another tenant's
# receiver, and the receiver must never be mounted on omar-core,
# zmart-intake, or any existing production service.
#
# ONE-INSTANCE CONSTRAINT: webhook dedupe is process-local, so exactly one
# machine runs (min_machines_running = 1, auto_stop_machines = "off").
# Do NOT scale this app horizontally until shared dedupe exists.
app = "los-duros-ig-webhook"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[env]
  PORT = "8080"
