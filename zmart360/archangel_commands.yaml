version: "1.0"
system: ZION_CORE
hierarchy:
  execution: "ARCHANGEL -> HOST -> ANGEL"
  legion_reserved_for_external_threats: true

commands:
  michael:
    display_name: "MICHAEL COMMAND"
    mission: "Defense & Response"
    source_note: "Revelation 12:7 explicitly describes Michael and his angels; software mapping is metaphorical."
    hosts:
      - id: MICHAEL.HOST-01
        name: "Watch"
        purpose: "Detection, anomaly triage, threat evidence"
      - id: MICHAEL.HOST-02
        name: "Defense"
        purpose: "Containment, isolation, coordinated defensive response"
      - id: MICHAEL.HOST-03
        name: "Incident Response"
        purpose: "Incident coordination, evidence preservation, protected recovery handoff"

  gabriel:
    display_name: "GABRIEL COMMAND"
    mission: "Communications & Dispatch"
    source_note: "Functional metaphor based on Gabriel's biblical messenger role; Scripture does not explicitly describe a Gabriel-led army."
    hosts:
      - id: GABRIEL.HOST-01
        name: "Internal Dispatch"
        purpose: "Internal task and event delivery"
      - id: GABRIEL.HOST-02
        name: "External Communications"
        purpose: "Authorized outbound communications"
      - id: GABRIEL.HOST-03
        name: "Delivery & Notification"
        purpose: "Notifications, delivery confirmation, routing observability"

  raphael:
    display_name: "RAPHAEL COMMAND"
    mission: "Recovery & Restoration"
    source_note: "Healing/restoration metaphor draws from Tobit; deuterocanonical in Catholic and Orthodox traditions."
    hosts:
      - id: RAPHAEL.HOST-01
        name: "Health"
        purpose: "Service and workflow health, dependency checks"
      - id: RAPHAEL.HOST-02
        name: "Repair"
        purpose: "Authorized rollback, repair and state recovery"
      - id: RAPHAEL.HOST-03
        name: "Verification"
        purpose: "Post-recovery integrity and safe-return verification"

angel_identity:
  pattern: "<COMMAND>.HOST-<NN>.ANGEL-<NNN>"
  dynamic_membership: true
  least_privilege: true
