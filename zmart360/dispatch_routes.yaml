version: "1.0"
system: ZION_CORE
dispatcher: SAN_GABRIEL

defaults:
  deny_unregistered_route: true
  least_privilege: true
  dynamic_angels: true
  external_input_is_authority: false

required_gates:
  integrity: SERAPHIM
  security: CHERUBIM
  policy: THRONES
  runtime: POWERS

routes:
  - intent: security_observation
    command: MICHAEL
    host: MICHAEL.HOST-01
  - intent: threat_detection
    command: MICHAEL
    host: MICHAEL.HOST-01
  - intent: containment
    command: MICHAEL
    host: MICHAEL.HOST-02
  - intent: defensive_response
    command: MICHAEL
    host: MICHAEL.HOST-02
  - intent: incident_response
    command: MICHAEL
    host: MICHAEL.HOST-03

  - intent: internal_dispatch
    command: GABRIEL
    host: GABRIEL.HOST-01
  - intent: external_communication
    command: GABRIEL
    host: GABRIEL.HOST-02
  - intent: notification
    command: GABRIEL
    host: GABRIEL.HOST-03
  - intent: delivery_tracking
    command: GABRIEL
    host: GABRIEL.HOST-03

  - intent: health_check
    command: RAPHAEL
    host: RAPHAEL.HOST-01
  - intent: recovery
    command: RAPHAEL
    host: RAPHAEL.HOST-02
  - intent: repair
    command: RAPHAEL
    host: RAPHAEL.HOST-02
  - intent: recovery_verification
    command: RAPHAEL
    host: RAPHAEL.HOST-03

fallback:
  action: REQUIRE_HUMAN_REVIEW
  reason: ROUTE_NOT_FOUND
